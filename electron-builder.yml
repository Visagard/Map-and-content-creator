appId: com.cartographer.app
productName: Cartographer
copyright: Cartographer

directories:
  output: dist
  buildResources: build

# Co se zabalí dovnitř aplikace (statický web + Electron runtime)
files:
  - electron/**/*
  - out/**/*
  - build/icon.png
  - package.json

asar: true

# --- Windows: instalátor sám vytvoří zástupce na ploše i v nabídce Start ---
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cartographer
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# --- macOS ---
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.graphics-design

# --- Linux ---
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Graphics
  desktop:
    Name: Cartographer
    Comment: D&D Map & Content Creator
